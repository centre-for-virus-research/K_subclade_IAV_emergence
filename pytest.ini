[pytest]
testpaths = tests/python
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --strict-markers
    --strict-config
    -ra

markers =
    slow: loads heavy dependencies (torch / transformers / the background dataset)
    requires_model: needs the PLANT checkpoint on disk

filterwarnings =
    ignore::DeprecationWarning:torch.*
    ignore::FutureWarning:transformers.*
